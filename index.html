<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎂 WUYI 蛋糕預訂小幫手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    .flatpickr-day.selected { background: #d97706 !important; border-color: #d97706 !important; }
    .flatpickr-day.today { border-color: #d97706 !important; }
    input, select, textarea { font-size: 16px !important; }
    @media (min-width: 640px) {
      input, select, textarea { font-size: 14px !important; }
    }
  </style>
</head>
<body class="bg-[#FBF9F5] text-stone-800 p-2 sm:p-4 min-h-screen flex justify-center items-center font-sans">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm p-4 sm:p-5 border border-stone-200 my-auto">

    <div class="text-center mb-2.5">
      <h1 class="text-lg font-bold text-stone-800 flex items-center justify-center gap-1.5">
        <span>🎂</span> WUYI 蛋糕預訂小幫手
      </h1>
      <p class="text-[11px] text-amber-800 bg-amber-50 py-0.5 px-3 rounded-full inline-block mt-1 font-medium border border-amber-200">
        填寫完成按送出，訂單會直接傳給ＷＵＹＩ客服
      </p>
    </div>

    <form id="cakeOrderForm" class="space-y-2">

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold mb-0.5 text-stone-700">尺寸 <span class="text-red-500">*</span></label>
          <select id="size" required class="w-full border border-stone-300 rounded-lg p-2 text-xs bg-white outline-none focus:border-stone-600">
            <option value="">選擇尺寸</option>
            <option value="漢堡盒 (4吋一層夾餡)">漢堡盒 4吋 (1~2人)</option>
            <option value="4 吋整模 (兩層夾餡)">4 吋整模 (2~3人)</option>
            <option value="6 吋整模 (兩層夾餡)">6 吋整模 (4~6人)</option>
            <option value="8 吋整模 (兩層夾餡)">8 吋整模 (8~10人)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-0.5 text-stone-700">口味 <span class="text-red-500">*</span></label>
          <select id="flavor" required class="w-full border border-stone-300 rounded-lg p-2 text-xs bg-white outline-none focus:border-stone-600 truncate">
            <option value="">請先選尺寸</option>
          </select>
        </div>
        <div id="flavorHint" class="hidden col-span-2 text-[11px] text-amber-700"></div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold mb-0.5 text-stone-700">取貨日期 <span class="text-red-500">*</span></label>
          <input type="text" id="date" placeholder="點擊選日期" required readonly class="w-full border border-stone-300 rounded-lg p-2 text-xs bg-white cursor-pointer outline-none focus:border-stone-600" />
        </div>
        <div>
          <label class="block text-xs font-semibold mb-0.5 text-stone-700">取貨時間 <span class="text-red-500">*</span></label>
          <select id="time" required class="w-full border border-stone-300 rounded-lg p-2 text-xs bg-white outline-none focus:border-stone-600">
            <option value="">選擇時間</option>
            <option value="15:00">15:00</option>
            <option value="15:30">15:30</option>
            <option value="16:00">16:00</option>
            <option value="16:30">16:30</option>
            <option value="17:00">17:00</option>
            <option value="17:30">17:30</option>
            <option value="18:00">18:00</option>
            <option value="18:30">18:30</option>
            <option value="19:00">19:00</option>
          </select>
        </div>
      </div>

      <div class="p-2 bg-amber-50 rounded-xl border border-amber-200 text-[11px] text-amber-900 space-y-0.5 leading-tight">
        <div>⏳ <strong>預訂須知：</strong>手作新鮮蛋糕<strong>建議提前一週預訂</strong>。</div>
        <div>📅 <strong>店休時間：</strong>每週一固定公休；週二為不定期公休。</div>
        <div>📍 <strong>自取地點：</strong>台南市中西區友愛街93號</div>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-0.5 text-stone-700">需加購（可複選）</label>
        <div class="grid grid-cols-3 gap-1 text-[11px] text-stone-700 bg-stone-50 p-2 rounded-xl border border-stone-200">
          <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="addons" value="2人餐具 $15" class="rounded text-stone-800 w-3.5 h-3.5" /> 2人餐具$15</label>
          <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="addons" value="5人餐具 $30" class="rounded text-stone-800 w-3.5 h-3.5" /> 5人餐具$30</label>
          <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="addons" value="10人餐具 $50" class="rounded text-stone-800 w-3.5 h-3.5" /> 10人餐具$50</label>
          <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="addons" value="生日插牌/蠟燭" class="rounded text-stone-800 w-3.5 h-3.5" /> 插牌/蠟燭</label>
          <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="candleCheckbox" name="addons" value="數字蠟燭 $30/支" class="rounded text-stone-800 w-3.5 h-3.5" /> 數字蠟燭$30</label>
          <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="addons" value="保冰袋/劑 $100" class="rounded text-stone-800 w-3.5 h-3.5" /> 保冰袋$100</label>
          <label class="flex items-center gap-1 cursor-pointer col-span-3 text-stone-500 pt-1 border-t border-stone-200"><input type="checkbox" id="noAddonCheckbox" name="addons" value="無" class="rounded text-stone-800 w-3.5 h-3.5" /> 無加購需求</label>
        </div>

        <div id="candleField" class="hidden mt-1 p-1.5 bg-amber-50 rounded-lg border border-amber-200">
          <input type="text" id="candleDetail" placeholder="請填寫數字蠟燭歲數（例如：28歲）" class="w-full border border-amber-300 rounded-lg p-1.5 text-xs bg-white outline-none" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold mb-0.5 text-stone-700">LINE 暱稱 <span class="text-red-500">*</span></label>
          <input type="text" id="lineName" required placeholder="LINE顯示名稱" class="w-full border border-stone-300 rounded-lg p-2 text-xs outline-none focus:border-stone-600" />
        </div>
        <div>
          <label class="block text-xs font-semibold mb-0.5 text-stone-700">姓名 <span class="text-red-500">*</span></label>
          <input type="text" id="name" required placeholder="訂購人姓名" class="w-full border border-stone-300 rounded-lg p-2 text-xs outline-none focus:border-stone-600" />
        </div>
        <div class="col-span-2">
          <label class="block text-xs font-semibold mb-0.5 text-stone-700">電話 <span class="text-red-500">*</span></label>
          <input type="tel" id="phone" required placeholder="例如：0912345678" class="w-full border border-stone-300 rounded-lg p-2 text-xs outline-none focus:border-stone-600" />
        </div>
      </div>

      <div class="p-2 bg-stone-50 rounded-xl border border-stone-200 space-y-1">
        <div class="text-[11px] font-semibold text-stone-600">🎨 選填客製需求</div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-stone-500 mb-0.5">蛋糕體顏色</label>
            <input type="text" id="cakeColor" placeholder="例如：淡粉色、米黃色" class="w-full border border-stone-300 rounded-lg p-1.5 text-xs bg-white outline-none focus:border-stone-600" />
          </div>
          <div>
            <label class="block text-[10px] text-stone-500 mb-0.5">英文題字（限2~3單字/無中文）</label>
            <input type="text" id="lettering" placeholder="例：Happy Birthday" class="w-full border border-stone-300 rounded-lg p-1.5 text-xs bg-white outline-none focus:border-stone-600" />
          </div>
        </div>
        <div>
          <label class="block text-[10px] text-stone-500 mb-0.5">其他客製備註</label>
          <input type="text" id="customNote" placeholder="如有其他特殊小細節可填寫" class="w-full border border-stone-300 rounded-lg p-1.5 text-xs bg-white outline-none focus:border-stone-600" />
        </div>
      </div>

      <div class="p-2 bg-rose-50 rounded-xl border border-rose-200">
        <label class="flex items-start gap-1.5 cursor-pointer text-[11px] text-rose-900 leading-tight font-medium">
          <input type="checkbox" id="photoConfirm" required class="mt-0.5 rounded text-rose-600 focus:ring-rose-500 w-3.5 h-3.5 flex-shrink-0" />
          <span>我已了解：送出後請於 LINE 傳送<strong>蛋糕造型參考圖（最多3款）</strong>方便報價 <span class="text-red-500">*</span></span>
        </label>
      </div>

      <div class="pt-0.5">
        <button type="submit" id="submitBtn" class="w-full bg-[#06C755] hover:bg-[#05b34c] text-white font-bold py-2.5 rounded-xl shadow transition duration-200 flex items-center justify-center gap-1.5 text-sm disabled:opacity-60">
          <span>🎂</span>
          <span id="submitBtnText">送出訂單給ＷＵＹＩ官方LINE</span>
        </button>
      </div>

    </form>
  </div>

  <script>
    const LIFF_ID = "2012143488-V8Xk20CM";
    const LINE_OA_ID = "@230fpemy";
    const SUBMIT_TEXT = "送出訂單給ＷＵＹＩ官方LINE";

    const CLOSED_DATES = [
      "2026-10-24",
      "2026-10-25",
      "2026-10-27",
      "2026-11-24",
      "2026-12-01"
    ];

    const PREORDER_DAYS = 3;

    const standardFlavors = [
      "A 原味戚風＋藍莓果醬&藍莓＋豆乳奶凍＋原味奶油",
      "B 可可戚風＋當季水果＋Oreo巧克力脆＋Oreo鹹奶油",
      "C 伯爵戚風＋鹽之花焦糖核桃＋可可奶凍＋原味奶油",
      "D 焙茶戚風＋當季水果＋芝麻奶凍＋原味奶油",
      "E 檸檬戚風＋當季水果＋焙茶奶凍＋原味奶油",
      "F 可可戚風＋可可奶凍＋Oreo巧克力脆＋原味奶油"
    ];

    const burgerFlavors = [
      "1. 原味戚風＋當季水果＋原味奶油",
      "2. 可可戚風＋Oreo巧克力脆＋原味奶油",
      "3. 伯爵戚風＋鹽之花焦糖核桃＋原味奶油",
      "4. 焙茶戚風＋當季水果＋原味奶油"
    ];

    const form = document.getElementById("cakeOrderForm");
    const submitBtn = document.getElementById("submitBtn");
    const submitBtnText = document.getElementById("submitBtnText");
    const sizeSelect = document.getElementById("size");
    const flavorSelect = document.getElementById("flavor");
    const flavorHint = document.getElementById("flavorHint");
    const candleCheckbox = document.getElementById("candleCheckbox");
    const candleField = document.getElementById("candleField");
    const candleDetail = document.getElementById("candleDetail");
    const noAddonCheckbox = document.getElementById("noAddonCheckbox");
    const otherAddonCheckboxes = document.querySelectorAll('input[name="addons"]:not([value="無"])');

    // ===== LIFF 初始化 =====
    let liffReady = false;
    const liffInitPromise = (typeof liff !== "undefined")
      ? liff.init({ liffId: LIFF_ID }).then(async () => {
          liffReady = true;
          // 在 LINE 內開啟時，自動帶入 LINE 暱稱
          if (liff.isInClient()) {
            try {
              const profile = await liff.getProfile();
              const lineNameInput = document.getElementById("lineName");
              if (!lineNameInput.value) lineNameInput.value = profile.displayName;
            } catch (e) {}
          }
        }).catch(() => { liffReady = false; })
      : Promise.resolve();

    // 從 LINE 返回表單時，還原送出按鈕
    function resetSubmitBtn() {
      submitBtn.disabled = false;
      submitBtnText.textContent = SUBMIT_TEXT;
    }
    window.addEventListener("pageshow", resetSubmitBtn);

    // 數字蠟燭展開/收合
    candleCheckbox.addEventListener("change", function() {
      if (this.checked) {
        candleField.classList.remove("hidden");
        candleDetail.focus();
      } else {
        candleField.classList.add("hidden");
        candleDetail.value = "";
      }
    });

    // 加購互斥邏輯
    noAddonCheckbox.addEventListener("change", function() {
      if (this.checked) {
        otherAddonCheckboxes.forEach(cb => cb.checked = false);
        candleField.classList.add("hidden");
        candleDetail.value = "";
      }
    });

    otherAddonCheckboxes.forEach(cb => {
      cb.addEventListener("change", function() {
        if (this.checked) noAddonCheckbox.checked = false;
      });
    });

    const now = new Date();
    const minBookingDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + PREORDER_DAYS);
    const lastDayOfNextMonth = new Date(now.getFullYear(), now.getMonth() + 2, 0);

    const formatYMD = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };

    flatpickr("#date", {
      locale: {
        firstDayOfWeek: 0,
        weekdays: { shorthand: ["日", "一", "二", "三", "四", "五", "六"], longhand: ["週日", "週一", "週二", "週三", "週四", "週五", "週六"] },
        months: { shorthand: ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"], longhand: ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"] }
      },
      minDate: formatYMD(minBookingDate),
      maxDate: formatYMD(lastDayOfNextMonth),
      dateFormat: "Y-m-d",
      disableMobile: true,
      disable: [
        function(date) {
          if (date.getDay() === 1) return true; // 每週一公休
          const dateStr = formatYMD(date);
          const mdStr = dateStr.slice(5);
          if (CLOSED_DATES.includes(dateStr) || CLOSED_DATES.includes(mdStr)) return true;
          return false;
        }
      ]
    });

    sizeSelect.addEventListener("change", function() {
      const val = this.value;
      flavorSelect.innerHTML = '<option value="">選擇口味</option>';

      if (val.includes("整模")) {
        flavorHint.classList.remove("hidden");
        flavorHint.innerText = "✨口味固定喔，目前當季水果為藍莓或綠葡萄";
        standardFlavors.forEach(item => {
          const opt = document.createElement("option");
          opt.value = item;
          opt.textContent = item;
          flavorSelect.appendChild(opt);
        });
      } else if (val.includes("漢堡盒")) {
        flavorHint.classList.add("hidden");
        burgerFlavors.forEach(item => {
          const opt = document.createElement("option");
          opt.value = item;
          opt.textContent = item;
          flavorSelect.appendChild(opt);
        });
      } else {
        flavorHint.classList.add("hidden");
        flavorSelect.innerHTML = '<option value="">請先選尺寸</option>';
      }
    });

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      if (!this.checkValidity()) {
        this.reportValidity();
        return;
      }

      let selectedAddons = Array.from(document.querySelectorAll('input[name="addons"]:checked')).map(el => el.value);
      if (candleCheckbox.checked && candleDetail.value.trim() !== "") {
        selectedAddons = selectedAddons.map(item => item.includes("數字蠟燭") ? `數字蠟燭 $30/支 (${candleDetail.value.trim()})` : item);
      }
      const addonsText = selectedAddons.length > 0 ? selectedAddons.join("、") : "無";

      const orderData = {
        cakeColor: document.getElementById("cakeColor").value.trim() || "無 / LINE討論",
        lettering: document.getElementById("lettering").value.trim() || "無",
        customNote: document.getElementById("customNote").value.trim() || "無",
        size: sizeSelect.value,
        flavor: flavorSelect.value,
        addons: addonsText,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        location: "台南市中西區友愛街93號",
        lineName: document.getElementById("lineName").value.trim(),
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim()
      };

      const orderMessage = 
`🎂【蛋糕訂購資訊】

蛋糕體顏色：${orderData.cakeColor}
英文題字：${orderData.lettering}
其他客製需求：${orderData.customNote}

蛋糕尺寸：${orderData.size}
蛋糕口味：${orderData.flavor}

需加購：${orderData.addons}

取貨日期：${orderData.date}
取貨時間：${orderData.time}
📍自取地點：${orderData.location}

訂購人 LINE 名稱：${orderData.lineName}
訂購人姓名：${orderData.name}
訂購人電話：${orderData.phone}

📸 圖片提醒：已確認送出後傳送參考圖片報價`;

      submitBtn.disabled = true;
      submitBtnText.textContent = "送出中...";

      await liffInitPromise;

      // 🚀 方案一：在 LINE 內開啟 → 直接以客人身分傳給官方 LINE，傳完關閉視窗
      if (liffReady && liff.isInClient()) {
        try {
          await liff.sendMessages([{ type: "text", text: orderMessage }]);
          liff.closeWindow();
          return;
        } catch (err) {
          // 傳送失敗則走備援
        }
      }

      // 🔁 方案二（備援）：開啟官方 LINE 並預填訂單，客人按傳送即可
      const lineUrl = `https://line.me/R/oaMessage/${LINE_OA_ID}/?${encodeURIComponent(orderMessage)}`;
      window.location.href = lineUrl;
    });
  </script>
</body>
</html>
